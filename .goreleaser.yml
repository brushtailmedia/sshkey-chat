version: 2

project_name: sshkey-chat

builds:
  - id: sshkey-server
    main: ./cmd/sshkey-server
    binary: sshkey-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: sshkey-ctl
    main: ./cmd/sshkey-ctl
    binary: sshkey-ctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

# Cross-platform macOS sign + notarize (GoReleaser OSS — uses
# anchore/quill under the hood; runs fine on the Linux release
# runner; Pro is only needed for .app/.dmg/.pkg, not bare
# binaries). certificate/key accept base64 contents directly,
# matching the APPLE_CERTIFICATE / APPLE_API_PRIVATE_KEY secrets.
# Gated on all required Apple secrets so partial secret config
# doesn't fail midway through release. `--snapshot` / fork runs
# without secrets won't fail. Bare binaries can't be stapled —
# Gatekeeper validates the notarization online on first run.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "APPLE_CERTIFICATE") (isEnvSet "APPLE_CERTIFICATE_PASSWORD") (isEnvSet "APPLE_API_ISSUER") (isEnvSet "APPLE_API_KEY") (isEnvSet "APPLE_API_PRIVATE_KEY") }}'
      ids:
        - sshkey-server
        - sshkey-ctl
      sign:
        certificate: "{{.Env.APPLE_CERTIFICATE}}"
        password: "{{.Env.APPLE_CERTIFICATE_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_API_ISSUER}}"
        key_id: "{{.Env.APPLE_API_KEY}}"
        key: "{{.Env.APPLE_API_PRIVATE_KEY}}"
        wait: true
        timeout: 20m

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - PROTOCOL.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: github-native

release:
  github:
    owner: brushtailmedia
    name: sshkey-chat
  draft: true
  prerelease: auto
